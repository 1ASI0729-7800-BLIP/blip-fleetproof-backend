spring.application.name=blip-fleetproof-backend

# Database (MySQL). Override with environment variables in each environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleetproof?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
