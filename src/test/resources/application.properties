spring.application.name=blip-fleetproof-backend-test

# Hermetic tests: in-memory H2 in MySQL compatibility mode, no MySQL required.
spring.datasource.url=jdbc:h2:mem:fleetproof;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
